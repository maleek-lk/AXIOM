<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mind Notes</title>
<style>
:root{
  --bg:#050507; --panel:rgba(17,17,22,.78); --line:rgba(255,255,255,.09);
  --text:#f7f7fb; --muted:#8d8d9b; --accent:#c8befa; --grid:rgba(255,255,255,.10);
  --shadow:0 20px 70px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{
  position:fixed;top:16px;left:16px;right:16px;z-index:5;
  display:flex;align-items:center;justify-content:space-between;pointer-events:none
}
.brand{pointer-events:auto;display:flex;align-items:center;gap:10px}
.brand h1{font-family:cursive;font-weight:600;font-size:23px;letter-spacing:.02em;margin:0}
.brand span{font-size:10px;color:var(--muted);padding:5px 8px;border:1px solid var(--line);border-radius:99px;background:rgba(0,0,0,.25)}
.actions{display:flex;gap:7px;pointer-events:auto}
button{
  border:1px solid var(--line);background:rgba(12,12,17,.72);backdrop-filter:blur(14px);
  color:var(--text);height:38px;padding:0 12px;border-radius:12px;cursor:pointer;
  box-shadow:0 8px 30px rgba(0,0,0,.2);font:inherit;font-size:12px
}
button:hover{background:rgba(30,30,38,.82)}
button:active{transform:scale(.97)}
#composer{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:7;
  width:min(680px,calc(100% - 28px));display:flex;gap:8px;align-items:center;
  padding:8px;border:1px solid var(--line);border-radius:17px;background:rgba(11,11,15,.78);
  backdrop-filter:blur(22px);box-shadow:var(--shadow)
}
#composer input{
  min-width:0;flex:1;background:transparent;border:0;outline:0;color:var(--text);
  padding:11px 12px;font-size:14px
}
#composer input::placeholder{color:#6f6f7b}
#addMother{white-space:nowrap}
#hint{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
  text-align:center;color:#777783;pointer-events:none;transition:.3s
}
#hint strong{display:block;font-family:cursive;color:#aaaab4;font-size:30px;font-weight:500;margin-bottom:5px}
#hint span{font-size:12px}
#searchBox{
  position:fixed;top:65px;right:16px;z-index:6;display:none;width:min(300px,calc(100% - 32px))
}
#searchBox input{
  width:100%;padding:11px 13px;border:1px solid var(--line);outline:0;border-radius:12px;
  color:var(--text);background:rgba(12,12,17,.86);backdrop-filter:blur(18px)
}
#themePanel{
  position:fixed;top:65px;right:16px;z-index:6;display:none;width:220px;
  padding:10px;border:1px solid var(--line);border-radius:15px;background:rgba(12,12,17,.88);
  backdrop-filter:blur(20px);box-shadow:var(--shadow)
}
.theme{display:flex;align-items:center;gap:10px;padding:9px;border-radius:10px;cursor:pointer;font-size:12px}
.theme:hover{background:rgba(255,255,255,.06)}
.swatches{display:flex}
.swatches i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.2);margin-right:-3px}
#toast{
  position:fixed;left:50%;top:76px;transform:translate(-50%,-8px);opacity:0;z-index:20;
  padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:rgba(15,15,20,.9);
  backdrop-filter:blur(15px);font-size:11px;pointer-events:none;transition:.25s
}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){
  #top{top:11px;left:11px;right:11px}
  .brand span{display:none}
  .actions button{width:38px;padding:0;font-size:0}
  .actions button::first-letter{font-size:15px}
  #composer{bottom:11px}
  #addMother{font-size:0;width:40px;padding:0}
  #addMother::before{content:"＋";font-size:18px}
}
</style>
</head>
<body>
<canvas id="graph"></canvas>

<div id="top">
  <div class="brand"><h1>Mind Notes</h1><span>temporary thought space</span></div>
  <div class="actions">
    <button id="searchBtn">⌕</button>
    <button id="themeBtn">◐</button>
    <button id="focusBtn">◎</button>
    <button id="exportBtn">↓</button>
    <button id="clearBtn">×</button>
  </div>
</div>

<div id="searchBox"><input id="search" placeholder="Find a thought..."></div>
<div id="themePanel"></div>

<div id="hint">
  <strong>Begin a thought universe</strong>
  <span>Create a mother with ＋, then let your thoughts connect.</span>
</div>

<div id="composer">
  <input id="noteInput" autocomplete="off" placeholder="What's on your mind?">
  <button id="addMother">＋ Mother</button>
  <button id="send">↗</button>
</div>
<div id="toast"></div>

<script>
const canvas=document.getElementById('graph'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,D=devicePixelRatio||1;
let nodes=[],edges=[],activeMother=null,drag=null,pan={x:0,y:0},zoom=1;
let themeName='Obsidian', searchTerm='', focusMother=null, lastTime=performance.now();

const themes={
 Obsidian:{bg:'#050507',grid:'rgba(255,255,255,.10)',text:'#f7f7fb',muted:'#8d8d9b',
  palette:['#C8BEFA','#8EC5FC','#D76D77','#FFAF7B','#74EBD5','#B5FFFC','#E0C3FC']},
 Candy:{bg:'#0b080d',grid:'rgba(255,220,235,.10)',text:'#fff7fb',muted:'#b7aab2',
  palette:['#FFDEE9','#B5FFFC','#E0C3FC','#FFAF7B','#C8BEFA','#ACB6E5']},
 Cosmic:{bg:'#050b0f',grid:'rgba(151,221,231,.10)',text:'#f3fbff',muted:'#8299a1',
  palette:['#203A43','#2C5364','#97DDE7','#C4F8FF','#8EC5FC','#C8BEFA']},
 Royal:{bg:'#08050d',grid:'rgba(215,109,119,.10)',text:'#fff7fa',muted:'#a998a0',
  palette:['#3A1C71','#D76D77','#FFAF7B','#C8BEFA','#E0C3FC','#FFDEE9']},
 Glacier:{bg:'#050b0c',grid:'rgba(172,182,229,.11)',text:'#f5ffff',muted:'#91a4a6',
  palette:['#74EBD5','#ACB6E5','#C4F8FF','#97DDE7','#E0C3FC','#8EC5FC']}
};
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const palette=()=>themes[themeName].palette;
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();

function screenToWorld(x,y){return{x:(x-W/2-pan.x)/zoom,y:(y-H/2-pan.y)/zoom}}
function worldToScreen(x,y){return{x:x*zoom+W/2+pan.x,y:y*zoom+H/2+pan.y}}
function words(s){return s.toLowerCase().normalize('NFKD').replace(/[^\w\s']/g,' ').split(/\s+/).filter(w=>w.length>2)}
const stop=new Set('the and for that this with from have was are but not you your about into then they them been will would could should just like what when where how why my our out all can had has his her its one two very more than also think wish found remain till let man pet'.split(' '));
function tokens(s){return words(s).filter(w=>!stop.has(w))}
function stem(w){return w.replace(/(ing|ed|es|s)$/,'')}
function similarity(a,b){
  const A=tokens(a).map(stem),B=tokens(b).map(stem);
  if(!A.length||!B.length)return 0;
  const sa=new Set(A),sb=new Set(B),inter=[...sa].filter(x=>sb.has(x)).length;
  const union=new Set([...sa,...sb]).size;
  let score=inter/union;
  const phrases=A.filter(x=>B.includes(x)).length;
  score += Math.min(.28,phrases*.12);
  return Math.min(1,score);
}
function createMother(name){
  name=name.trim()||'Untitled Thoughts';
  const p=palette(), n={id:uid(),type:'mother',text:name,x:(Math.random()-.5)*180,y:(Math.random()-.5)*120,
    vx:0,vy:0,r:43,color:p[nodes.filter(x=>x.type==='mother').length%p.length],born:performance.now()};
  nodes.push(n);activeMother=n.id;focusMother=null;updateHint();toast('Mother created');
}
function createNote(text){
  text=text.trim();if(!text)return;
  if(!activeMother){createMother('Random Thoughts')}
  const m=nodes.find(n=>n.id===activeMother);if(!m)return;
  const p=palette();
  const angle=Math.random()*Math.PI*2, dist=90+Math.random()*90;
  const n={id:uid(),type:'note',text,x:m.x+Math.cos(angle)*dist,y:m.y+Math.sin(angle)*dist,
    vx:Math.cos(angle)*.3,vy:Math.sin(angle)*.3,r:25+Math.min(20,text.length/18),
    color:p[Math.floor(Math.random()*p.length)],born:performance.now()};
  nodes.push(n);
  edges.push({a:m.id,b:n.id,strength:.78,kind:'mother',age:0});
  for(const other of nodes){
    if(other===n||other.type==='mother')continue;
    const s=similarity(n.text,other.text);
    if(s>=.16)edges.push({a:n.id,b:other.id,strength:Math.min(.95,.18+s*.82),kind:'semantic',age:0});
  }
  activeMother=m.id;updateHint();
}
function nodeBy(id){return nodes.find(n=>n.id===id)}
function pruneEdges(){edges=edges.filter(e=>nodeBy(e.a)&&nodeBy(e.b))}
function physics(dt){
  const t=dt/16.67;
  for(const n of nodes){n.vx*=Math.pow(.93,t);n.vy*=Math.pow(.93,t)}
  for(let i=0;i<nodes.length;i++){
    const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){
      const b=nodes[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+1,d=Math.sqrt(d2);
      const min=55+(a.r+b.r)*.35;
      if(d<min*3){
        const f=(min*3-d)/d*.018*t;
        a.vx-=dx*f;a.vy-=dy*f;b.vx+=dx*f;b.vy+=dy*f;
      }
    }
  }
  for(const e of edges){
    const a=nodeBy(e.a),b=nodeBy(e.b);if(!a||!b)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+.001;
    const target=e.kind==='mother'?145:125;
    const f=(d-target)*.0008*e.strength*t;
    a.vx+=dx/d*f;b.vx-=dx/d*f;a.vy+=dy/d*f;b.vy-=dy/d*f;
  }
  const mothers=nodes.filter(n=>n.type==='mother');
  for(const n of nodes){
    if(n.type==='mother')continue;
    const m=nodeBy(n.motherId)||mothers.find(x=>edges.some(e=>(e.a===x.id&&e.b===n.id)||(e.b===x.id&&e.a===n.id)));
    if(m){n.vx+=(m.x-n.x)*.00017*t;n.vy+=(m.y-n.y)*.00017*t}
  }
  for(const n of nodes){
    if(drag&&drag.id===n.id)continue;
    n.x+=n.vx*t;n.y+=n.vy*t;
  }
  edges.forEach(e=>e.age=Math.min(1,e.age+.018*t));
}
function drawGrid(){
  const th=themes[themeName];ctx.fillStyle=th.bg;ctx.fillRect(0,0,W,H);
  const spacing=34*zoom;
  const ox=(W/2+pan.x)%spacing,oy=(H/2+pan.y)%spacing;
  ctx.fillStyle=th.grid;
  for(let x=ox;x<W;x+=spacing)for(let y=oy;y<H;y+=spacing){ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill()}
}
function draw(){
  drawGrid();
  ctx.save();
  const visible=focusMother?nodes.filter(n=>n.id===focusMother||edges.some(e=>e.a===focusMother&&e.b===n.id||e.b===focusMother&&e.a===n.id)):nodes;
  const visibleIds=new Set(visible.map(n=>n.id));
  ctx.lineCap='round';
  for(const e of edges){
    if(!visibleIds.has(e.a)||!visibleIds.has(e.b))continue;
    const a=nodeBy(e.a),b=nodeBy(e.b),s=searchTerm&&((a.text||'').toLowerCase().includes(searchTerm)||(b.text||'').toLowerCase().includes(searchTerm));
    const p1=worldToScreen(a.x,a.y),p2=worldToScreen(b.x,b.y);
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
    ctx.strokeStyle=s?'rgba(255,255,255,.48)':e.kind==='mother'?'rgba(255,255,255,.13)':'rgba(190,180,255,.20)';
    ctx.lineWidth=(e.kind==='mother'?1.2:0.8)*zoom;ctx.stroke();
  }
  for(const n of visible){
    const p=worldToScreen(n.x,n.y),match=!searchTerm||(n.text||'').toLowerCase().includes(searchTerm);
    ctx.globalAlpha=match?1:.13;
    const glow=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,n.r*2.4);
    glow.addColorStop(0,n.color+'55');glow.addColorStop(1,n.color+'00');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(p.x,p.y,n.r*2.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(p.x,p.y,n.r,0,Math.PI*2);
    ctx.fillStyle=n.type==='mother'?n.color+'2c':n.color+'20';ctx.fill();
    ctx.strokeStyle=n.color;ctx.lineWidth=n.type==='mother'?2:1.1;ctx.stroke();
    if(n.type==='mother'){ctx.beginPath();ctx.arc(p.x,p.y,n.r+5+Math.sin(performance.now()/900)*2,0,Math.PI*2);ctx.strokeStyle=n.color+'22';ctx.stroke()}
    ctx.fillStyle=themes[themeName].text;ctx.textAlign='center';ctx.textBaseline='middle';
    const max=n.type==='mother'?22:14;
    ctx.font=(n.type==='mother'?'600 ':'500 ')+(n.type==='mother'?14:11)+'px '+(n.type==='mother'?'cursive':'Inter,system-ui');
    const label=n.text.length>max?n.text.slice(0,max-1)+'…':n.text;
    const lines=wrap(label,n.type==='mother'?150:120,ctx);
    lines.forEach((line,i)=>ctx.fillText(line,p.x,p.y+(i-(lines.length-1)/2)*14));
    ctx.globalAlpha=1;
  }
  ctx.restore();
}
function wrap(text,max,ctx){
  const out=[],ws=text.split(' ');let line='';
  for(const w of ws){const test=line?line+' '+w:w;if(ctx.measureText(test).width>max&&line){out.push(line);line=w}else line=test}
  if(line)out.push(line);return out.slice(0,3);
}
function loop(now){const dt=Math.min(34,now-lastTime);lastTime=now;physics(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function pointerPos(e){return screenToWorld(e.clientX,e.clientY)}
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);const p=pointerPos(e);
  let hit=null;
  for(let i=nodes.length-1;i>=0;i--){const n=nodes[i],d=Math.hypot(p.x-n.x,p.y-n.y);if(d<n.r+8){hit=n;break}}
  if(hit){drag={id:hit.id,ox:p.x-hit.x,oy:p.y-hit.y};activeMother=hit.type==='mother'?hit.id:(activeMother||hit.id)}
  else drag={pan:true,lastX:e.clientX,lastY:e.clientY};
});
canvas.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(drag.pan){pan.x+=e.clientX-drag.lastX;pan.y+=e.clientY-drag.lastY;drag.lastX=e.clientX;drag.lastY=e.clientY}
  else{const p=pointerPos(e),n=nodeBy(drag.id);if(n){n.x=p.x-drag.ox;n.y=p.y-drag.oy;n.vx=n.vy=0}}
});
canvas.addEventListener('pointerup',()=>drag=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();const old=zoom, factor=e.deltaY<0?1.08:.92;
  const before=screenToWorld(e.clientX,e.clientY);zoom=Math.max(.35,Math.min(2.5,zoom*factor));
  pan.x=e.clientX-W/2-before.x*zoom;pan.y=e.clientY-H/2-before.y*zoom;
},{passive:false});

document.getElementById('send').onclick=()=>{const i=document.getElementById('noteInput');createNote(i.value);i.value='';i.focus()};
document.getElementById('noteInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('send').click()}});
document.getElementById('addMother').onclick=()=>{
  const name=prompt('Name this thought universe:','Random Thoughts');if(name!==null)createMother(name)
};
document.getElementById('clearBtn').onclick=()=>{
  if(confirm('Clear this temporary mind space?')){nodes=[];edges=[];activeMother=null;focusMother=null;pan={x:0,y:0};zoom=1;updateHint()}
};
document.getElementById('searchBtn').onclick=()=>{const b=document.getElementById('searchBox');b.style.display=b.style.display==='block'?'none':'block';document.getElementById('search').focus()};
document.getElementById('search').addEventListener('input',e=>searchTerm=e.target.value.trim().toLowerCase());
document.getElementById('focusBtn').onclick=()=>{
  if(!nodes.length)return toast('Create a mother first');
  focusMother=focusMother?null:(activeMother||nodes.find(n=>n.type==='mother')?.id);toast(focusMother?'Focused mother':'Full canvas')
};
document.getElementById('themeBtn').onclick=()=>{
  const p=document.getElementById('themePanel');p.style.display=p.style.display==='block'?'none':'block';
};
const tp=document.getElementById('themePanel');
Object.keys(themes).forEach(name=>{
  const d=document.createElement('div');d.className='theme';
  d.innerHTML='<div class="swatches">'+themes[name].palette.slice(0,4).map(c=>`<i style="background:${c}"></i>`).join('')+'</div><span>'+name+'</span>';
  d.onclick=()=>{themeName=name;document.documentElement.style.setProperty('--bg',themes[name].bg);tp.style.display='none';toast(name+' theme')};
  tp.appendChild(d);
});
document.getElementById('exportBtn').onclick=()=>{
  const old={x:pan.x,y:pan.y,z:zoom};pan={x:0,y:0};zoom=Math.min(1,Math.max(.45,Math.min(W/1000,H/700)));
  draw();const link=document.createElement('a');link.download='mind-notes.png';link.href=canvas.toDataURL('image/png');link.click();
  pan={x:old.x,y:old.y};zoom=old.z;toast('Mind note exported')
};
function updateHint(){document.getElementById('hint').style.opacity=nodes.length?'0':'1'}
let toastTimer;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1300)}
createMother('Random Thoughts');
</script>
</body>
</html>
